<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal hardware</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f4f6f8; color: #172b3a; }
      main { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
      h1 { margin: 4px 0 18px; font-size: 28px; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: #e4e9ef; margin-bottom: 18px; }
      .tabs button { border: 0; border-radius: 9px; padding: 12px; background: transparent; color: #334b5c; font: inherit; font-weight: 600; }
      .tabs button.active { background: white; color: #0033cc; box-shadow: 0 1px 3px rgb(0 0 0 / 12%); }
      .panel { background: white; border-radius: 16px; min-height: 320px; padding: 12px; box-shadow: 0 2px 10px rgb(0 0 0 / 7%); }
      .hidden { display: none; }
      #status { text-align: center; padding: 70px 20px; color: #607080; }
      #error { color: #a61b1b; background: #fff1f1; padding: 14px; border-radius: 10px; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Terminal hardware</h1>
      <div id="error" class="hidden" role="alert"></div>
      <div class="tabs" role="tablist" aria-label="Terminal hardware">
        <button id="shop-tab" class="active" role="tab" aria-selected="true">Shop</button>
        <button id="orders-tab" role="tab" aria-selected="false">Orders</button>
      </div>
      <div class="panel">
        <div id="status">Loading hardware shop…</div>
        <div id="shop-panel"></div>
        <div id="orders-panel" class="hidden"></div>
      </div>
    </main>
    <script src="/terminal-hardware.js"></script>
  </body>
</html>
